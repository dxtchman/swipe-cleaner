name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SwipeCleaner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SwipeCleaner
          path: SwipeCleaner.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Swipe Cleaner build ${{ github.run_number }}
          body: Tap SwipeCleaner.apk below to download, then open it to install.
          files: SwipeCleaner.apk
          make_latest: true
